name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**/*.go'
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - '**/*.sql'
              - '**/migrations/**'
              - '**/testdata/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.golangci.*'
              - '.github/workflows/ci.yml'
              - '!**/*.md'

  test-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Build container
        run: docker build -t uatu:ci .

  go:
    needs: [changes, test-build]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check CI result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          BUILD_RESULT: ${{ needs.test-build.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CODE_CHANGED" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$CODE_CHANGED" = false
            test "$BUILD_RESULT" = skipped
          fi

name: Publish Image

# Manually builds and publishes the container image for an existing release
# tag, for example when the publish job in Release Please did not run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.2.0)
        required: true
        type: string
      latest:
        description: Also move the latest tag to this release
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG_NAME: ${{ inputs.tag }}
    steps:
      - name: Verify release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag: $TAG_NAME" >&2; exit 1; }
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ inputs.latest }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

# Plain manifests that stand in for the future Helm chart. They exercise the
# runtime contract in docs/adr/0008-kubernetes-delivery-contract.md and expect a
# Secret named uatu-db (key url) and a Secret named uatu-github (key token).
apiVersion: v1
kind: Service
metadata:
  name: uatu-api
spec:
  selector:
    app: uatu-api
  ports:
    - port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uatu-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uatu-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: uatu-api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash] # spread each ReplicaSet during rollouts
          labelSelector:
            matchLabels:
              app: uatu-api
      containers:
        - name: uatu
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          lifecycle:
            preStop:
              sleep: # keep serving while endpoints are removed
                seconds: 5
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: UATU_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: uatu-db, key: url}
            - name: UATU_DB_MAX_CONNS
              value: "3"
            - name: UATU_API_KEY
              valueFrom:
                secretKeyRef: {name: uatu-api-key, key: key}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uatu-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uatu-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: uatu-worker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash] # spread each ReplicaSet during rollouts
          labelSelector:
            matchLabels:
              app: uatu-worker
      containers:
        - name: uatu
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["collect", "--loop"]
          ports:
            - name: health
              containerPort: 3001
          env:
            - name: UATU_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: uatu-db, key: url}
            - name: UATU_DB_MAX_CONNS
              value: "3"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef: {name: uatu-github, key: token}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 2
            failureThreshold: 2

apiVersion: batch/v1
kind: Job
metadata:
  name: uatu-migrate
spec:
  backoffLimit: 0
  completions: 2
  parallelism: 2 # Two concurrent migrators must serialize on the database lock.
  template:
    metadata:
      labels:
        app: uatu-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uatu
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: UATU_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: uatu-db, key: url}
            - name: UATU_DB_MAX_CONNS
              value: "2"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
